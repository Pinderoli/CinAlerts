name: Scan cinemas

# Chains behind Cloudflare (Odeon, Curzon, Cineworld, Vue) block GitHub's IPs, so without a proxy
# this updates Everyman and Picturehouse only; other runners (e.g. a Mac) cover the rest.
# Add a CINALERTS_PROXY secret (residential proxy URL) to scan everything from here.

on:
  schedule:
    - cron: "0 7 * * *" # daily, 07:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Scan, alert and publish
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          CINALERTS_PROXY: ${{ secrets.CINALERTS_PROXY }}
          CINALERTS_RUNNER: github-actions
          TZ: Europe/London
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          scripts/run-and-push.sh
